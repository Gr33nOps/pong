<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<meta name="theme-color" content="#f7f6f1">
		<meta name="description" content="Play PONG, a paper-and-ink arcade game with local and private-room online multiplayer.">
		<meta property="og:title" content="$GODOT_PROJECT_NAME">
		<meta property="og:description" content="Paper-and-ink Pong with aimed serves, lively rallies, and private online rooms.">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://gr33nops.github.io/pong/">
		<meta property="og:image" content="index.png">
		<meta name="twitter:card" content="summary_large_image">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
:root {
	color-scheme: light;
	--ink: #1d1d1a;
	--soft-ink: #6f6e67;
	--paper: #f7f6f1;
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	width: 100%;
	height: 100%;
}

body {
	color: var(--ink);
	background: var(--paper);
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: fixed;
	inset: 0;
	display: flex;
	align-items: center;
	justify-content: center;
	background-color: var(--paper);
	background-image:
		radial-gradient(circle at 18% 23%, rgba(30, 30, 26, 0.035) 0 0.7px, transparent 0.9px),
		radial-gradient(circle at 72% 64%, rgba(30, 30, 26, 0.025) 0 0.8px, transparent 1px),
		linear-gradient(92deg, rgba(255, 255, 255, 0.45), transparent 42%, rgba(30, 30, 26, 0.018));
	background-size: 19px 17px, 23px 21px, 100% 100%;
	visibility: visible;
	z-index: 10;
}

#status-card {
	width: min(78vw, 430px);
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 18px;
	text-align: center;
}

#loader-title {
	font-family: "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
	font-size: clamp(52px, 10vw, 82px);
	font-weight: 700;
	letter-spacing: 0.08em;
	line-height: 0.9;
	transform: rotate(-0.8deg);
}

#loader-subtitle,
#status-label,
#status-percent,
#status-notice {
	font-family: "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
	font-weight: 700;
	letter-spacing: 0.08em;
}

#loader-subtitle {
	margin-top: -8px;
	color: var(--soft-ink);
	font-size: 12px;
}

#mini-court {
	position: relative;
	width: min(66vw, 286px);
	height: 112px;
	border: 2px solid var(--ink);
	transform: rotate(0.35deg);
}

#mini-court::before {
	content: "";
	position: absolute;
	inset: 2px -3px -3px 2px;
	border: 1px solid rgba(29, 29, 26, 0.5);
	transform: rotate(-0.7deg);
}

#court-line {
	position: absolute;
	top: 8px;
	bottom: 8px;
	left: 50%;
	border-left: 2px dashed rgba(29, 29, 26, 0.5);
}

.loader-paddle {
	position: absolute;
	top: 29px;
	width: 9px;
	height: 54px;
	background: var(--ink);
	box-shadow: 2px 1px 0 rgba(29, 29, 26, 0.28);
}

.loader-paddle.left {
	left: 17px;
	transform: rotate(-1.5deg);
}

.loader-paddle.right {
	right: 17px;
	transform: rotate(1.2deg);
}

#loader-ball {
	position: absolute;
	top: 48px;
	left: calc(50% - 9px);
	width: 18px;
	height: 18px;
	border-radius: 47% 53% 49% 51%;
	background: var(--ink);
	animation: rally 1.25s cubic-bezier(0.44, 0.08, 0.56, 0.92) infinite alternate;
}

#loading-copy {
	width: 100%;
	display: flex;
	justify-content: space-between;
	align-items: baseline;
	font-size: 13px;
}

#status-progress {
	appearance: none;
	-webkit-appearance: none;
	width: 100%;
	height: 13px;
	border: 2px solid var(--ink);
	border-radius: 0;
	background: transparent;
	transform: rotate(-0.3deg);
	overflow: hidden;
}

#status-progress::-webkit-progress-bar {
	background: transparent;
}

#status-progress::-webkit-progress-value {
	background: var(--ink);
	transition: width 120ms linear;
}

#status-progress::-moz-progress-bar {
	background: var(--ink);
}

#status-progress:indeterminate {
	background: linear-gradient(90deg, transparent 0 32%, var(--ink) 32% 54%, transparent 54% 100%);
	background-size: 220% 100%;
	animation: ink-progress 1.1s linear infinite;
}

#status-notice {
	display: none;
	width: min(78vw, 520px);
	padding: 18px 20px;
	border: 2px solid var(--ink);
	background: rgba(247, 246, 241, 0.94);
	font-size: 15px;
	line-height: 1.5;
	transform: rotate(0.25deg);
}

@keyframes rally {
	from { transform: translateX(-88px) rotate(-8deg); }
	to { transform: translateX(88px) rotate(8deg); }
}

@keyframes ink-progress {
	from { background-position: 100% 0; }
	to { background-position: -100% 0; }
}

@media (prefers-reduced-motion: reduce) {
	#loader-ball,
	#status-progress:indeterminate {
		animation: none;
	}
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
		<noscript>This game needs JavaScript enabled to run.</noscript>

		<div id="status" role="status" aria-live="polite">
			<div id="status-card">
				<div id="loader-title">PONG</div>
				<div id="loader-subtitle">PAPER · INK · FIRST TO FIVE</div>
				<div id="mini-court" aria-hidden="true">
					<div id="court-line"></div>
					<div class="loader-paddle left"></div>
					<div id="loader-ball"></div>
					<div class="loader-paddle right"></div>
				</div>
				<div id="loading-copy">
					<span id="status-label">INKING THE COURT</span>
					<span id="status-percent">0%</span>
				</div>
				<progress id="status-progress"></progress>
			</div>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusCard = document.getElementById('status-card');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const statusLabel = document.getElementById('status-label');
	const statusPercent = document.getElementById('status-percent');
	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) return;
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusCard.style.display = mode === 'notice' ? 'none' : 'flex';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		statusNotice.replaceChildren();
		text.split('\n').forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		setStatusNotice(err instanceof Error ? err.message : (typeof err === 'string' ? err : 'An unknown error occurred.'));
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		displayFailureNotice('This browser is missing features required to run the game:\n' + missing.join('\n'));
		return;
	}

	setStatusMode('progress');
	engine.startGame({
		onProgress(current, total) {
			if (current > 0 && total > 0) {
				const ratio = Math.min(current / total, 1);
				const percent = Math.round(ratio * 100);
				statusProgress.value = current;
				statusProgress.max = total;
				statusPercent.textContent = percent + '%';
				statusLabel.textContent = ratio < 0.35 ? 'SHARPENING PENCILS' : (ratio < 0.82 ? 'INKING THE COURT' : 'FINAL STROKES');
			} else {
				statusProgress.removeAttribute('value');
				statusProgress.removeAttribute('max');
				statusPercent.textContent = '...';
			}
		},
	}).then(() => setStatusMode('hidden'), displayFailureNotice);
}());
		</script>
	</body>
</html>
