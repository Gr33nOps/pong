<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<meta name="theme-color" content="#f7f6f1">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="default">
		<meta name="description" content="Paddle Polygon is Pong for 2 to 7 players: one paddle per side, a court that shrinks as players are knocked out, and a one-dimensional finale. Play AI or friends online.">
		<meta property="og:title" content="$GODOT_PROJECT_NAME">
		<meta property="og:description" content="2 to 7 players on a paper-and-ink polygon court. Knock-outs shrink the shape until the 1D Pong finale.">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://gr33nops.github.io/pong/">
		<meta property="og:image" content="index.png">
		<meta name="twitter:card" content="summary_large_image">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
:root {
	color-scheme: light;
	--ink: #1d1d1a;
	--paper: #f7f6f1;
	--court: #f6f6f6;
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	width: 100%;
	height: 100%;
}

body {
	color: var(--ink);
	background: var(--paper);
	overflow: hidden;
	touch-action: none;
	overscroll-behavior: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
}

/* Paper strips cover the engine's black letterbox bars. They ignore pointers so
   touches in the margins still reach the game and steer the paddle. */
.court-bar {
	position: fixed;
	display: none;
	background: var(--court);
	pointer-events: none;
	z-index: 5;
}

#rotate-prompt {
	position: fixed;
	inset: 0;
	display: none;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 18px;
	padding: 24px;
	box-sizing: border-box;
	background: var(--paper);
	text-align: center;
	z-index: 20;
	font-family: "Segoe Print", "Comic Sans MS", sans-serif;
}

#rotate-icon {
	width: 92px;
	height: 92px;
	animation: rotate-hint 2.4s ease-in-out infinite;
}

#rotate-title {
	font-size: 26px;
	font-weight: 700;
	letter-spacing: 0.08em;
}

#rotate-copy {
	max-width: 280px;
	font-family: system-ui, sans-serif;
	font-size: 15px;
	line-height: 1.45;
}

#rotate-play {
	min-width: 200px;
	min-height: 52px;
	padding: 0 22px;
	border: 2px solid var(--ink);
	background: transparent;
	color: var(--ink);
	font: 700 17px system-ui, sans-serif;
	letter-spacing: 0.08em;
	touch-action: manipulation;
}

/* Phones and tablets held upright would shrink the 16:9 court to a thin strip. */
@media (orientation: portrait) and (pointer: coarse) {
	#rotate-prompt {
		display: flex;
	}
}

@keyframes rotate-hint {
	0%, 20% { transform: rotate(0deg); }
	50%, 70% { transform: rotate(-90deg); }
	100% { transform: rotate(0deg); }
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: fixed;
	inset: 0;
	display: flex;
	align-items: center;
	justify-content: center;
	background-color: var(--paper);
	background-image:
		radial-gradient(circle at 18% 23%, rgba(30, 30, 26, 0.035) 0 0.7px, transparent 0.9px),
		radial-gradient(circle at 72% 64%, rgba(30, 30, 26, 0.025) 0 0.8px, transparent 1px),
		linear-gradient(92deg, rgba(255, 255, 255, 0.45), transparent 42%, rgba(30, 30, 26, 0.018));
	background-size: 19px 17px, 23px 21px, 100% 100%;
	visibility: visible;
	z-index: 10;
}

#status-card {
	width: min(72vw, 360px);
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 20px;
	text-align: center;
}

#loader-title {
	font-family: "Segoe Print", "Comic Sans MS", sans-serif;
	font-size: clamp(34px, 7vw, 48px);
	font-weight: 700;
	letter-spacing: 0.08em;
	line-height: 1.05;
}

#loader-logo-window {
	position: relative;
	width: clamp(104px, 24vw, 150px);
	height: clamp(112px, 26vw, 160px);
	overflow: hidden;
}

#loader-logo {
	position: absolute;
	left: 50%;
	top: 50%;
	width: clamp(250px, 58vw, 330px);
	height: clamp(250px, 58vw, 330px);
	max-width: none;
	object-fit: contain;
	transform: translate(-50%, -50%);
}

#status-progress {
	appearance: none;
	-webkit-appearance: none;
	width: 100%;
	height: 13px;
	border: 2px solid var(--ink);
	border-radius: 0;
	background: transparent;
	overflow: hidden;
}

#status-progress::-webkit-progress-bar {
	background: transparent;
}

#status-progress::-webkit-progress-value {
	background: var(--ink);
	transition: width 120ms linear;
}

#status-progress::-moz-progress-bar {
	background: var(--ink);
}

#status-progress:indeterminate {
	background: linear-gradient(90deg, transparent 0 32%, var(--ink) 32% 54%, transparent 54% 100%);
	background-size: 220% 100%;
	animation: ink-progress 1.1s linear infinite;
}

#status-notice {
	display: none;
	width: min(78vw, 520px);
	padding: 18px 20px;
	border: 2px solid var(--ink);
	background: rgba(247, 246, 241, 0.94);
	font-family: system-ui, sans-serif;
	font-size: 15px;
	line-height: 1.5;
}

@keyframes ink-progress {
	from { background-position: 100% 0; }
	to { background-position: -100% 0; }
}

@media (prefers-reduced-motion: reduce) {
	#status-progress:indeterminate,
	#rotate-icon {
		animation: none;
	}
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
		<noscript>This game needs JavaScript enabled to run.</noscript>
		<div class="court-bar" id="court-bar-a" aria-hidden="true"></div>
		<div class="court-bar" id="court-bar-b" aria-hidden="true"></div>

		<div id="rotate-prompt" role="dialog" aria-label="Rotate your device">
			<svg id="rotate-icon" viewBox="0 0 64 64" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
				<rect x="20" y="8" width="24" height="44" rx="4"></rect>
				<line x1="29" y1="45" x2="35" y2="45"></line>
				<path d="M50 30a18 18 0 0 1-6 13"></path>
				<polyline points="44 37 44 43 50 43"></polyline>
			</svg>
			<div id="rotate-title">TURN SIDEWAYS</div>
			<div id="rotate-copy">Paddle Polygon plays in landscape. Rotate your phone, or tap below to play full screen.</div>
			<button id="rotate-play" type="button">PLAY FULL SCREEN</button>
		</div>

		<div id="status" role="status" aria-live="polite">
			<div id="status-card">
				<div id="loader-title">PADDLE<br>POLYGON</div>
				<div id="loader-logo-window" aria-hidden="true">
					<img id="loader-logo" src="$GODOT_SPLASH" alt="">
				</div>
				<progress id="status-progress" aria-label="Loading Paddle Polygon"></progress>
			</div>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	// Matches the fixed 1152x648 court that Godot letterboxes with black bars.
	const COURT_ASPECT = 1152 / 648;
	const barA = document.getElementById('court-bar-a');
	const barB = document.getElementById('court-bar-b');

	function placeBar(bar, left, top, width, height) {
		bar.style.left = left + 'px';
		bar.style.top = top + 'px';
		bar.style.width = width + 'px';
		bar.style.height = height + 'px';
		bar.style.display = width > 0 && height > 0 ? 'block' : 'none';
	}

	function layoutCourtBars() {
		const w = window.innerWidth;
		const h = window.innerHeight;
		if (w / h > COURT_ASPECT) {
			const bar = Math.ceil((w - h * COURT_ASPECT) / 2) + 1;
			placeBar(barA, 0, 0, bar, h);
			placeBar(barB, w - bar, 0, bar, h);
		} else {
			const bar = Math.ceil((h - w / COURT_ASPECT) / 2) + 1;
			placeBar(barA, 0, 0, w, bar);
			placeBar(barB, 0, h - bar, w, bar);
		}
	}

	window.addEventListener('resize', layoutCourtBars);
	window.addEventListener('orientationchange', layoutCourtBars);
	layoutCourtBars();

	const coarsePointer = window.matchMedia('(pointer: coarse)');
	const root = document.documentElement;
	let userLeftFullscreen = false;
	let wasFullscreen = false;

	function lockLandscape() {
		if (screen.orientation && screen.orientation.lock) {
			screen.orientation.lock('landscape').catch(() => {});
		}
	}

	function enterFullscreen() {
		if (!coarsePointer.matches || document.fullscreenElement || !root.requestFullscreen) {
			return;
		}
		root.requestFullscreen({ navigationUI: 'hide' }).then(lockLandscape).catch(() => {});
	}

	document.addEventListener('fullscreenchange', () => {
		if (document.fullscreenElement) {
			wasFullscreen = true;
		} else if (wasFullscreen) {
			// Respect a deliberate exit; only the explicit button re-enters after that.
			userLeftFullscreen = true;
		}
		layoutCourtBars();
	});

	// Phones hide the browser chrome only in fullscreen, which makes the court
	// noticeably larger. Browsers require a user gesture, so use the first taps.
	document.addEventListener('touchend', () => {
		if (!userLeftFullscreen) {
			enterFullscreen();
		}
	}, { passive: true });

	const playButton = document.getElementById('rotate-play');
	if (!root.requestFullscreen) {
		// iPhone Safari has no element fullscreen; rotating is the only option there.
		playButton.style.display = 'none';
	}
	playButton.addEventListener('click', () => {
		userLeftFullscreen = false;
		enterFullscreen();
	});
}());

(function () {
	const statusOverlay = document.getElementById('status');
	const statusCard = document.getElementById('status-card');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) return;
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusCard.style.display = mode === 'notice' ? 'none' : 'flex';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		statusNotice.replaceChildren();
		text.split('\n').forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		setStatusNotice(err instanceof Error ? err.message : (typeof err === 'string' ? err : 'An unknown error occurred.'));
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		displayFailureNotice('This browser is missing features required to run the game:\n' + missing.join('\n'));
		return;
	}

	setStatusMode('progress');
	engine.startGame({
		onProgress(current, total) {
			if (current > 0 && total > 0) {
				statusProgress.value = current;
				statusProgress.max = total;
			} else {
				statusProgress.removeAttribute('value');
				statusProgress.removeAttribute('max');
			}
		},
	}).then(() => setStatusMode('hidden'), displayFailureNotice);
}());
		</script>
	</body>
</html>
