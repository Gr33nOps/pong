<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="theme-color" content="#f7f6f1">
		<meta name="description" content="Paddle Polygon is online Pong for 2 to 10 friends: one paddle per side, a court that shrinks as players are knocked out, and a one-dimensional finale.">
		<meta property="og:title" content="$GODOT_PROJECT_NAME">
		<meta property="og:description" content="Online Pong for 2 to 10 friends on a paper-and-ink polygon court. Knock-outs shrink the shape until the 1D Pong finale.">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://gr33nops.github.io/pong/">
		<meta property="og:image" content="index.png">
		<meta name="twitter:card" content="summary_large_image">
		<title>$GODOT_PROJECT_NAME</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap">
		<style>
:root {
	color-scheme: light;
	--ink: #1d1d1a;
	--paper: #f7f6f1;
	--court: #f6f6f6;
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	width: 100%;
	height: 100%;
}

body {
	color: var(--ink);
	background: var(--paper);
	overflow: hidden;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* Paper strips cover the black bars Godot draws beside the 16:9 game. */
.court-bar {
	position: fixed;
	display: none;
	background: var(--court);
	pointer-events: none;
	z-index: 5;
}

/* Loading screen. */
#status {
	position: fixed;
	inset: 0;
	display: flex;
	align-items: center;
	justify-content: center;
	background-color: var(--paper);
	background-image:
		radial-gradient(circle at 18% 23%, rgba(30, 30, 26, 0.035) 0 0.7px, transparent 0.9px),
		radial-gradient(circle at 72% 64%, rgba(30, 30, 26, 0.025) 0 0.8px, transparent 1px),
		linear-gradient(92deg, rgba(255, 255, 255, 0.45), transparent 42%, rgba(30, 30, 26, 0.018));
	background-size: 19px 17px, 23px 21px, 100% 100%;
	font-family: "Patrick Hand", "Segoe Print", "Comic Sans MS", sans-serif;
	z-index: 10;
	transition: opacity 350ms ease;
}

#status.done {
	opacity: 0;
	pointer-events: none;
}

#status-card {
	width: min(72vw, 360px);
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 20px;
	text-align: center;
}

#loader-title {
	font-size: clamp(40px, 8vw, 58px);
	letter-spacing: 0.08em;
	line-height: 1.05;
}

#status-text {
	margin-top: -8px;
	font-size: 20px;
	letter-spacing: 0.08em;
}

#loader-logo-window {
	position: relative;
	width: clamp(104px, 24vw, 150px);
	height: clamp(112px, 26vw, 160px);
	overflow: hidden;
}

#loader-logo {
	position: absolute;
	left: 50%;
	top: 50%;
	width: clamp(250px, 58vw, 330px);
	height: clamp(250px, 58vw, 330px);
	max-width: none;
	object-fit: contain;
	transform: translate(-50%, -50%);
}

#status-progress {
	appearance: none;
	-webkit-appearance: none;
	width: 100%;
	height: 13px;
	border: 2px solid var(--ink);
	border-radius: 0;
	background: transparent;
	overflow: hidden;
}

#status-progress::-webkit-progress-bar {
	background: transparent;
}

#status-progress::-webkit-progress-value {
	background: var(--ink);
	transition: width 120ms linear;
}

#status-progress::-moz-progress-bar {
	background: var(--ink);
}

#status-progress:indeterminate {
	background: linear-gradient(90deg, transparent 0 32%, var(--ink) 32% 54%, transparent 54% 100%);
	background-size: 220% 100%;
	animation: ink-progress 1.1s linear infinite;
}

#status-notice {
	display: none;
	width: min(78vw, 520px);
	padding: 18px 20px;
	border: 2px solid var(--ink);
	background: rgba(247, 246, 241, 0.94);
	font-family: system-ui, sans-serif;
	font-size: 15px;
	line-height: 1.5;
}

@keyframes ink-progress {
	from { background-position: 100% 0; }
	to { background-position: -100% 0; }
}

@media (prefers-reduced-motion: reduce) {
	#status-progress:indeterminate {
		animation: none;
	}
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
		<noscript>This game needs JavaScript enabled to run.</noscript>
		<div class="court-bar" id="court-bar-a" aria-hidden="true"></div>
		<div class="court-bar" id="court-bar-b" aria-hidden="true"></div>

		<div id="status" role="status" aria-live="polite">
			<div id="status-card">
				<div id="loader-title">PADDLE<br>POLYGON</div>
				<div id="loader-logo-window" aria-hidden="true">
					<img id="loader-logo" src="$GODOT_SPLASH" alt="">
				</div>
				<progress id="status-progress" aria-label="Loading Paddle Polygon"></progress>
				<div id="status-text">LOADING</div>
			</div>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

// Place the paper strips over Godot's black side (or top/bottom) bars.
(function () {
	const GAME_ASPECT = 1152 / 648;
	const barA = document.getElementById('court-bar-a');
	const barB = document.getElementById('court-bar-b');

	function placeBar(bar, left, top, width, height) {
		bar.style.left = left + 'px';
		bar.style.top = top + 'px';
		bar.style.width = width + 'px';
		bar.style.height = height + 'px';
		bar.style.display = width > 0 && height > 0 ? 'block' : 'none';
	}

	function placeBars() {
		const w = window.innerWidth;
		const h = window.innerHeight;
		if (w / h > GAME_ASPECT) {
			const bar = Math.ceil((w - h * GAME_ASPECT) / 2) + 1;
			placeBar(barA, 0, 0, bar, h);
			placeBar(barB, w - bar, 0, bar, h);
		} else {
			const bar = Math.ceil((h - w / GAME_ASPECT) / 2) + 1;
			placeBar(barA, 0, 0, w, bar);
			placeBar(barB, 0, h - bar, w, bar);
		}
	}

	window.addEventListener('resize', placeBars);
	placeBars();
}());

// Loading screen: show progress, then remove it when the game starts.
(function () {
	const loading = document.getElementById('status');
	const card = document.getElementById('status-card');
	const progress = document.getElementById('status-progress');
	const text = document.getElementById('status-text');
	const notice = document.getElementById('status-notice');

	function showError(error) {
		console.error(error);
		const message = error instanceof Error ? error.message : String(error || 'An unknown error occurred.');
		notice.replaceChildren();
		message.split('\n').forEach((line) => {
			notice.appendChild(document.createTextNode(line));
			notice.appendChild(document.createElement('br'));
		});
		card.style.display = 'none';
		notice.style.display = 'block';
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		showError('This browser is missing features required to run the game:\n' + missing.join('\n'));
		return;
	}

	engine.startGame({
		onProgress(current, total) {
			if (current > 0 && total > 0) {
				progress.value = current;
				progress.max = total;
				text.textContent = current < total ? 'LOADING ' + Math.floor(current / total * 100) + '%' : 'STARTING';
			} else {
				progress.removeAttribute('value');
				progress.removeAttribute('max');
				text.textContent = 'LOADING';
			}
		},
	}).then(() => {
		loading.classList.add('done');
		setTimeout(() => loading.remove(), 400);
	}, showError);
}());
		</script>
	</body>
</html>
