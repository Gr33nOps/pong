name: Build Release Artifacts

on:
  push:
    tags: ["v*"]

env:
  GODOT_VERSION: 4.7.1
  EXPORT_NAME: pong

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Export and validate
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Move export templates into place
        run: |
          set -euo pipefail
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.config/godot
          if [ "$HOME" != "/root" ] && [ -d /root/.config/godot ]; then
            cp -a /root/.config/godot/. ~/.config/godot/
          fi
          if [ "$HOME" != "/root" ] && [ -d /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
            cp -a /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/. ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          fi

      - name: Set release version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i -E "s/^config\/version=.*/config\/version=\"$VERSION\"/" project.godot
          sed -i -E "s/^application\/file_version=.*/application\/file_version=\"$VERSION\"/" export_presets.cfg
          sed -i -E "s/^application\/product_version=.*/application\/product_version=\"$VERSION\"/" export_presets.cfg
          sed -i -E "s/^version\/name=.*/version\/name=\"$VERSION\"/" export_presets.cfg
          sed -i -E "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" export_presets.cfg

      - name: Import resources
        run: godot --headless --verbose --editor --quit

      - name: Run deterministic smoke tests
        run: godot --headless --path . --script tests/smoke.gd

      - name: Export Windows Desktop
        run: |
          set -euo pipefail
          mkdir -p /tmp/pong/windows
          godot --headless --verbose --path . --export-release "Windows Desktop" /tmp/pong/windows/pong.exe

      - name: Export Web
        run: |
          set -euo pipefail
          mkdir -p /tmp/pong/web
          godot --headless --verbose --path . --export-release "Web" /tmp/pong/web/index.html

      - name: Export Android sideload APK
        run: |
          set -euo pipefail
          # Use Godot's built-in APK template; Play Store/Gradle signing is intentionally not configured.
          sed -i 's#gradle_build/use_gradle_build=true#gradle_build/use_gradle_build=false#' export_presets.cfg
          sed -i 's#gradle_build/min_sdk="29"#gradle_build/min_sdk=""#' export_presets.cfg
          sed -i 's#gradle_build/target_sdk="36"#gradle_build/target_sdk=""#' export_presets.cfg
          sed -i 's#keystore/debug_user="androiddebugkey"#keystore/debug_user=""#' export_presets.cfg
          sed -i 's#keystore/debug_password="android"#keystore/debug_password=""#' export_presets.cfg
          mkdir -p /tmp/pong/android
          godot --headless --verbose --path . --export-debug "Android" /tmp/pong/android/pong.apk

      - name: Package release archives
        run: |
          set -euo pipefail
          cd /tmp/pong/windows && zip -q -r "$GITHUB_WORKSPACE/pong-windows.zip" .
          cd /tmp/pong/web && zip -q -r "$GITHUB_WORKSPACE/pong-web.zip" .
          cp /tmp/pong/android/pong.apk "$GITHUB_WORKSPACE/pong-android-sideload.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            pong-windows.zip
            pong-web.zip
            pong-android-sideload.apk
