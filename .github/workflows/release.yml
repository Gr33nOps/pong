name: Build Release Artifacts

on:
  push:
    tags: ["v*"]

env:
  GODOT_VERSION: 4.7.1

defaults:
  run:
    shell: bash

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Export and validate
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Move export templates into place
        run: |
          set -euo pipefail
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.config/godot
          if [ "$HOME" != "/root" ] && [ -d /root/.config/godot ]; then
            cp -a /root/.config/godot/. ~/.config/godot/
          fi
          if [ "$HOME" != "/root" ] && [ -d /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
            cp -a /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/. ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          fi

      - name: Set release version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i -E "s/^config\/version=.*/config\/version=\"$VERSION\"/" project.godot
          sed -i -E "s/^application\/file_version=.*/application\/file_version=\"$VERSION\"/" export_presets.cfg
          sed -i -E "s/^application\/product_version=.*/application\/product_version=\"$VERSION\"/" export_presets.cfg

      - name: Import resources
        run: godot --headless --verbose --editor --quit

      - name: Run deterministic client and Online tests
        run: |
          set -euo pipefail
          godot --headless --path . --script tests/arena_smoke.gd
          godot --headless --path server --script res://arena_room_smoke.gd
          PORT=9081 godot --headless --path server --scene server_main.tscn >/tmp/pong-server.log 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          sleep 1
          godot --headless --path . --script tests/arena_online_smoke.gd

      - name: Export Windows Desktop
        run: |
          set -euo pipefail
          mkdir -p /tmp/pong/windows
          godot --headless --verbose --path . --export-release "Windows Desktop" /tmp/pong/windows/paddle-polygon.exe

      - name: Export Web
        run: |
          set -euo pipefail
          mkdir -p /tmp/pong/web
          godot --headless --verbose --path . --export-release "Web" /tmp/pong/web/index.html
          grep -Fq 'id="loader-title"' /tmp/pong/web/index.html
          grep -Fq 'id="loader-logo"' /tmp/pong/web/index.html
          if grep -Fq '$GODOT_' /tmp/pong/web/index.html; then
            echo "Unexpanded Web-shell placeholder remains" >&2
            exit 1
          fi

      - name: Package release archives
        run: |
          set -euo pipefail
          WINDOWS_ARCHIVE="Paddle-Polygon-v${VERSION}-Windows-x64.zip"
          WEB_ARCHIVE="Paddle-Polygon-v${VERSION}-Web-itch.zip"
          cd /tmp/pong/windows && zip -q -r "$GITHUB_WORKSPACE/$WINDOWS_ARCHIVE" .
          cd /tmp/pong/web && zip -q -r "$GITHUB_WORKSPACE/$WEB_ARCHIVE" .
          cd "$GITHUB_WORKSPACE"
          sha256sum "$WINDOWS_ARCHIVE" "$WEB_ARCHIVE" > SHA256SUMS.txt
          cat > RELEASE_NOTES.md <<EOF
          # Paddle Polygon v${VERSION}

          Online Pong for 2 to 10 friends. Every player defends one side of a polygon court; one miss knocks you out and the court folds into the next shape, down to a one-dimensional finale.

          ## Downloads

          | Platform | File | Notes |
          |---|---|---|
          | Windows x64 | \`$WINDOWS_ARCHIVE\` | Extract and run the included executable. |
          | Web | \`$WEB_ARCHIVE\` | Browser-ready archive with \`index.html\` at its root. |

          SHA-256 hashes for all downloads are provided in \`SHA256SUMS.txt\`.

          ## Online play

          Press **PLAY**, type your name, create a room and send your friends the invite link or the six-character code. The court has one side per person. The hosted server may take a moment to wake after being idle.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Paddle Polygon v${{ env.VERSION }}
          body_path: RELEASE_NOTES.md
          files: |
            Paddle-Polygon-v${{ env.VERSION }}-Windows-x64.zip
            Paddle-Polygon-v${{ env.VERSION }}-Web-itch.zip
            SHA256SUMS.txt
