name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.1
  EXPORT_NAME: pong

permissions:
  contents: write

jobs:
  build:
    name: Export & Release
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Move export templates into place
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Import resources
        run: godot --headless --verbose --editor --quit

      - name: Export Windows Desktop
        run: |
          mkdir -v -p pong
          godot --headless --verbose --export-release "Windows Desktop" "$(pwd)/pong/pong.exe"

      - name: Export Web
        run: |
          mkdir -v -p pong/web
          godot --headless --verbose --export-release "Web" "$(pwd)/pong/web/index.html"

      - name: Export Android (debug-signed APK)
        run: |
          mkdir -v -p pong/android
          godot --headless --verbose --export-debug "Android" "$(pwd)/pong/android/Pong.apk"

      - name: Package Windows build
        run: |
          cd pong
          zip -j "../${EXPORT_NAME}-windows.zip" pong.exe pong.pck

      - name: Package Web build
        run: |
          cd pong/web
          zip -r "../../${EXPORT_NAME}-web.zip" .

      - name: Rename Android APK
        run: mv pong/android/Pong.apk "${EXPORT_NAME}-android.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ env.EXPORT_NAME }}-windows.zip
            ${{ env.EXPORT_NAME }}-web.zip
            ${{ env.EXPORT_NAME }}-android.apk
