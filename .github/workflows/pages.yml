name: Build & Deploy Web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Isolate each branch or pull request so dependency-update checks cannot
  # cancel a main-branch deployment.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download and verify Godot 4.7.1
        env:
          GODOT_SHA512: 4ccdab7a48eeccbe8819a2fc1f6262f8d72065d98601bcb3743fcbd7ebd39f373758a788ee3293a05ec5b2c48538266c437404312e372225cd2df273945a2de9
          TEMPLATES_SHA512: afcc83d8d3d298038f19c58744a0d660fa75dd4baa33cb55d1011bb2565a2a8c2381728924564cb909e37c205a23f21b521b23bd057993afd43ae4da0b2f9d47
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/4.7.1-stable"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            "$base/Godot_v4.7.1-stable_linux.x86_64.zip" -o /tmp/godot.zip
          printf '%s  %s\n' "$GODOT_SHA512" /tmp/godot.zip | sha512sum --check --status
          unzip -q /tmp/godot.zip -d /tmp/godot

          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            "$base/Godot_v4.7.1-stable_export_templates.tpz" -o /tmp/templates.tpz
          printf '%s  %s\n' "$TEMPLATES_SHA512" /tmp/templates.tpz | sha512sum --check --status
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mkdir -p ~/.local/share/godot/export_templates/4.7.1.stable
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/4.7.1.stable/

      - name: Import resources
        run: |
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --import

      - name: Static checks
        run: git diff --check

      - name: Run client smoke tests
        run: |
          set -euo pipefail
          godot=/tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          for test in tests/smoke.gd tests/menu_layout_smoke.gd tests/online_lobby_smoke.gd; do
            "$godot" --headless --path . --script "$test"
          done

      - name: Run authoritative Online tests
        run: |
          set -euo pipefail
          godot=/tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          "$godot" --headless --path server --script res://match_lifecycle_smoke.gd
          "$godot" --headless --path server --script res://room_rejoin_smoke.gd
          PORT=9081 "$godot" --headless --path server --scene server_main.tscn >/tmp/pong-server.log 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          sleep 1
          for test in tests/server_smoke.gd tests/server_multiclient_smoke.gd tests/online_match_lifecycle_smoke.gd tests/online_connection_smoke.gd; do
            "$godot" --headless --path . --script "$test"
          done

      - name: Export Web build
        run: |
          set -euo pipefail
          mkdir -p /tmp/pong-web
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --export-release "Web" /tmp/pong-web/index.html
          grep -Fq 'id="loader-title"' /tmp/pong-web/index.html
          grep -Fq 'id="loader-logo"' /tmp/pong-web/index.html
          if grep -Fq '$GODOT_' /tmp/pong-web/index.html; then
            echo "Unexpanded Web-shell placeholder remains" >&2
            exit 1
          fi

      - name: Version Web runtime assets
        run: |
          set -euo pipefail
          cd /tmp/pong-web
          asset_base="pong-${GITHUB_SHA::12}"
          for suffix in js pck wasm audio.worklet.js audio.position.worklet.js; do
            mv "index.${suffix}" "${asset_base}.${suffix}"
          done
          mv index.png "${asset_base}.png"
          mv index.icon.png "${asset_base}.icon.png"
          mv index.apple-touch-icon.png "${asset_base}.apple-touch-icon.png"
          sed -i \
            -e "s/index\.apple-touch-icon\.png/${asset_base}.apple-touch-icon.png/g" \
            -e "s/index\.icon\.png/${asset_base}.icon.png/g" \
            -e "s/index\.png/${asset_base}.png/g" \
            -e "s/index\.js/${asset_base}.js/g" \
            -e "s/\"executable\":\"index\"/\"executable\":\"${asset_base}\"/g" \
            -e "s/\"index\.pck\"/\"${asset_base}.pck\"/g" \
            -e "s/\"index\.wasm\"/\"${asset_base}.wasm\"/g" \
            index.html
          for suffix in js pck wasm audio.worklet.js audio.position.worklet.js png icon.png apple-touch-icon.png; do
            test -s "${asset_base}.${suffix}"
          done
          grep -Fq "src=\"${asset_base}.js\"" index.html
          grep -Fq "\"executable\":\"${asset_base}\"" index.html
          if grep -Eq 'src="index\.(js|png)"|"executable":"index"|"index\.(pck|wasm)"' index.html; then
            echo "Unversioned runtime reference remains in index.html" >&2
            exit 1
          fi

      - name: Export Windows smoke build
        run: |
          set -euo pipefail
          mkdir -p /tmp/pong-windows
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --export-release "Windows Desktop" /tmp/pong-windows/pong.exe

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: /tmp/pong-web

  deploy-pages:
    needs: build-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
