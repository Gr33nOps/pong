name: Build & Deploy Web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Isolate each branch or pull request so dependency-update checks cannot
  # cancel a main-branch deployment.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download and verify Godot 4.7.1
        env:
          GODOT_SHA512: 4ccdab7a48eeccbe8819a2fc1f6262f8d72065d98601bcb3743fcbd7ebd39f373758a788ee3293a05ec5b2c48538266c437404312e372225cd2df273945a2de9
          TEMPLATES_SHA512: afcc83d8d3d298038f19c58744a0d660fa75dd4baa33cb55d1011bb2565a2a8c2381728924564cb909e37c205a23f21b521b23bd057993afd43ae4da0b2f9d47
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/4.7.1-stable"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            "$base/Godot_v4.7.1-stable_linux.x86_64.zip" -o /tmp/godot.zip
          printf '%s  %s\n' "$GODOT_SHA512" /tmp/godot.zip | sha512sum --check --status
          unzip -q /tmp/godot.zip -d /tmp/godot

          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            "$base/Godot_v4.7.1-stable_export_templates.tpz" -o /tmp/templates.tpz
          printf '%s  %s\n' "$TEMPLATES_SHA512" /tmp/templates.tpz | sha512sum --check --status
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mkdir -p ~/.local/share/godot/export_templates/4.7.1.stable
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/4.7.1.stable/

      - name: Import resources
        run: |
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --import

      - name: Static checks
        run: git diff --check

      - name: Run smoke tests
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script tests/smoke.gd

      - name: Export Web build
        run: |
          set -euo pipefail
          mkdir -p /tmp/pong-web
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --export-release "Web" /tmp/pong-web/index.html

      - name: Export Windows smoke build
        run: |
          set -euo pipefail
          mkdir -p /tmp/pong-windows
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --export-release "Windows Desktop" /tmp/pong-windows/pong.exe

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: /tmp/pong-web

  deploy-pages:
    needs: build-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
