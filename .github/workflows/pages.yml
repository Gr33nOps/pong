name: Build & Deploy Web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-main
  cancel-in-progress: true

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1 (Linux)
        run: |
          curl -sL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          echo "$PWD" >> $GITHUB_PATH
          mkdir -p ~/.local/share/godot/export_templates
          curl -sL -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates ~/.local/share/godot/export_templates/4.7.1.stable

      - name: Import resources
        run: |
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --import

      - name: Static checks
        run: git diff --check

      - name: Run smoke tests
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script tests/smoke.gd

      - name: Export Web build
        run: |
          mkdir -p /tmp/pong-web
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --export-release "Web" /tmp/pong-web/index.html

      - name: Export Windows smoke build
        run: |
          mkdir -p /tmp/pong-windows
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --export-release "Windows Desktop" /tmp/pong-windows/pong.exe

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/pong-web

  deploy-pages:
    needs: build-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
